<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Scheda Palestra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with day tabs, one column of exercise cards, fixed rest-timer bar at the bottom */
:root {
  --bg: #eceef1;
  --surface: #ffffff;
  --surface-2: #f4f5f7;
  --ink: #16191d;
  --muted: #5d6570;
  --line: #d7dbe0;
  --accent: #2448d8;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9ff;
  --done: #1d7a46;
  --done-soft: #dcf1e4;
  --warn: #9a5b00;
  --warn-soft: #fbedd6;
  --danger: #b3261e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1b1e23; --surface-2: #23272d; --ink: #eef0f3; --muted: #9aa2ad;
    --line: #2f343b; --accent: #7d97ff; --accent-ink: #0d1020; --accent-soft: #232b4a;
    --done: #5fd08f; --done-soft: #183224; --warn: #f2b45a; --warn-soft: #3a2c15; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1b1e23; --surface-2: #23272d; --ink: #eef0f3; --muted: #9aa2ad;
  --line: #2f343b; --accent: #7d97ff; --accent-ink: #0d1020; --accent-soft: #232b4a;
  --done: #5fd08f; --done-soft: #183224; --warn: #f2b45a; --warn-soft: #3a2c15; --danger: #ff8a80;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 10px 10px; display: grid; gap: 8px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--display); font-size: 1.6rem; letter-spacing: .02em; text-transform: uppercase; }
.brand .sync { font-size: .78rem; color: var(--muted); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 4px; font-family: var(--display); font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase; position: relative; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tabs button .dot { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

main .wrap { padding-block: 14px 140px; display: grid; gap: 12px; }
.dayhead { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.dayhead h2 { margin: 0; font-family: var(--display); font-size: 2.1rem; line-height: 1; text-transform: uppercase; }
.dayhead p { margin: 0; color: var(--muted); font-size: .9rem; }
.section-label { font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: .95rem; color: var(--muted); margin-top: 6px; }

.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.ex.complete { border-color: var(--done); }
.ss { border: 2px dashed var(--accent); border-radius: 16px; padding: 8px; display: grid; gap: 8px; }
.ss > .ss-label { font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-size: .95rem; padding: 0 4px; display: flex; justify-content: space-between; gap: 8px; }
.ss > .ss-label span:last-child { color: var(--muted); letter-spacing: .02em; text-transform: none; font-family: var(--body); font-size: .82rem; }
.ex-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ex-h h3 { margin: 0; font-size: 1.08rem; font-weight: 600; min-width: 0; flex: 1; }
.edit { flex: none; width: 34px; height: 34px; margin: -6px -6px -6px 0; border: 0; background: transparent; border-radius: 8px; display: grid; place-items: center; }
.edit svg { width: 18px; height: 18px; stroke: var(--muted); }
.editor { display: grid; gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 10px; }
.editor label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); }
.editor input, .editor select { height: 42px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 10px; font-size: 1rem; color: var(--ink); }
.ed-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.small { height: 40px; font-size: 1rem; padding: 0 16px; flex: 1; }
.edit.info { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 700; font-size: 1.05rem; color: var(--accent); border: 1.5px solid var(--accent); width: 26px; height: 26px; border-radius: 50%; margin: 0 2px 0 0; padding: 0; }
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, #000 45%, transparent); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; border-radius: 18px 18px 0 0; box-sizing: border-box; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; align-content: start; }
.sh-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.sh-head h2 { margin: 0; font-family: var(--display); font-size: 1.7rem; line-height: 1.05; text-transform: uppercase; text-wrap: balance; }
.sh-x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); font-size: 1.4rem; line-height: 1; }
.sheet h3 { margin: 6px 0 0; font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: .95rem; color: var(--muted); }
.sh-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.sh-tags span { background: var(--accent-soft); color: var(--accent); font-size: .8rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.cues { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; line-height: 1.45; }
.mistake { margin: 0; background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; }
.sh-empty, .sh-sub { margin: 0; color: var(--muted); }
.linkbtn { display: grid; place-items: center; text-decoration: none; box-sizing: border-box; }
.sh-search { height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 12px; font-size: 1rem; width: 100%; box-sizing: border-box; }
.sh-groups { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.sh-groups button { flex: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: .85rem; }
.sh-groups button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sh-list { display: grid; gap: 6px; }
.sh-item { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.sh-item b { font-weight: 600; }
.sh-item small { color: var(--muted); }
.sh-item.cur { border-color: var(--accent); background: var(--accent-soft); }
.set.warm .n { font-size: .95rem; color: var(--warn); }
.set.warm:not(.done) .field input { border-style: dashed; }
.dayhead .plan-btn { flex: none; height: 38px; padding: 0 14px; }
.pe-hint { margin: 0; color: var(--muted); font-size: .9rem; }
.pe-list { display: grid; gap: 6px; }
.pe-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; }
.pe-name { flex: 1; min-width: 0; font-weight: 600; }
.pe-tools { display: flex; gap: 2px; flex: none; }
.pe-btn { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 8px; display: grid; place-items: center; }
.pe-btn svg { width: 19px; height: 19px; stroke: var(--ink); }
.pe-btn.danger svg { stroke: var(--danger); }
.pe-btn:disabled { opacity: .25; cursor: default; }
.pe-confirm { height: 36px; border: 0; border-radius: 8px; background: var(--danger); color: var(--surface); font-weight: 600; padding: 0 12px; }
.pe-ss { border: 2px dashed var(--accent); border-radius: 14px; padding: 6px; display: grid; gap: 6px; }
.pe-ss-h { display: flex; justify-content: space-between; align-items: center; padding-left: 6px; font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.pe-ss-f { display: flex; gap: 8px; align-items: center; }
.pe-note { flex: 1; min-width: 0; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 0 10px; font-size: .9rem; }
.pe-text { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 0 8px; height: 36px; }
.btn.pe-add { justify-self: start; flex: none; }
.sh-item.free { border-style: dashed; border-color: var(--accent); }
.ex-actions { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.warm-toggle { justify-self: start; border: 0; background: transparent; color: var(--accent); font-size: .85rem; font-weight: 600; padding: 4px 0; }
.notif-ask { display: grid; gap: 8px; background: var(--accent-soft); border-radius: 14px; padding: 12px; }
.notif-ask p { margin: 0; font-size: .92rem; }
.notif-ask .btn { justify-self: start; flex: none; }
.chip.rep { background: var(--accent-soft); color: var(--accent); }
.tgt { font-family: var(--display); font-size: 1.05rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.last { margin: 0; font-size: .86rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.chip { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.chip.up { background: var(--warn-soft); color: var(--warn); }
.alt { display: flex; gap: 6px; }
.alt button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: .85rem; }
.alt button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 24px 1fr 1fr 52px; gap: 8px; align-items: center; }
.set .n { font-family: var(--display); font-size: 1.15rem; color: var(--muted); text-align: center; }
.field { position: relative; }
.field input { width: 100%; box-sizing: border-box; height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 34px 0 12px; font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.field input::placeholder { color: var(--muted); opacity: .7; font-weight: 500; }
.field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: .78rem; color: var(--muted); pointer-events: none; }
.tick { height: 48px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.tick svg { width: 22px; height: 22px; stroke: var(--muted); }
.set.done .tick { background: var(--done); border-color: var(--done); }
.set.done .tick svg { stroke: var(--surface); }
.set.done .field input { background: var(--done-soft); border-color: transparent; }
.set.one { grid-template-columns: 24px 1fr 52px; }

.finish { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.finish label { font-size: .85rem; color: var(--muted); }
.finish textarea { width: 100%; box-sizing: border-box; min-height: 64px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 10px; resize: vertical; }
.btn { height: 50px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-size: 1.25rem; letter-spacing: .05em; text-transform: uppercase; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-size: 1rem; height: 42px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.msg { margin: 0; font-size: .9rem; color: var(--done); font-weight: 600; }

.hist { display: grid; gap: 10px; }
.hcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.hcard summary { list-style: none; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
.hcard summary::-webkit-details-marker { display: none; }
.hcard summary b { font-family: var(--display); font-size: 1.3rem; text-transform: uppercase; font-weight: 700; }
.hcard summary small { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.hbody { padding: 0 12px 12px; display: grid; gap: 6px; }
.hrow { display: flex; justify-content: space-between; gap: 12px; font-size: .92rem; border-top: 1px solid var(--line); padding-top: 6px; }
.hrow span:first-child { min-width: 0; }
.hrow span:last-child { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.hnote { font-size: .9rem; color: var(--muted); font-style: italic; margin: 4px 0; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 20px; color: var(--muted); text-align: center; }

.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--ink); color: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateY(110%); transition: transform .2s ease; }
.timer.on { transform: none; }
.timer .wrap { padding-block: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.timer .clock { font-family: var(--display); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.timer .lbl { font-size: .82rem; opacity: .75; grid-column: 1; }
.timer .ctrls { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; }
.timer .ctrls button { height: 44px; min-width: 52px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); background: transparent; color: var(--bg); font-weight: 600; }
.timer .bar { grid-column: 1 / -1; height: 4px; background: color-mix(in srgb, var(--bg) 20%, transparent); border-radius: 4px; overflow: hidden; }
.timer .bar i { display: block; height: 100%; background: var(--accent); width: 100%; }
.timer.go .clock { color: var(--done); }
@media (prefers-reduced-motion: reduce) { .timer { transition: none; } }
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Scheda Palestra</h1><span class="sync" id="sync">Salvataggio sul telefono</span></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<div class="sheet-bg" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-box"></div></div>
<div class="timer" id="timer" aria-live="polite">
  <div class="wrap">
    <div class="clock" id="clock">0:00</div>
    <div class="ctrls">
      <button id="tMinus" aria-label="Togli 15 secondi">−15</button>
      <button id="tPlus" aria-label="Aggiungi 15 secondi">+15</button>
      <button id="tSkip">Salta</button>
    </div>
    <div class="lbl" id="tLabel">Recupero</div>
    <div class="bar"><i id="tBar"></i></div>
  </div>
</div>

<script>
// ---------- Exercise library: [id, name, group, equipment, cues separated by |, main mistake] ----------
const LIB_RAW = [
  ["panca-piana-bil", "Panca piana con bilanciere", "Petto", "Bilanciere", "Scapole strette e basse, piedi ben piantati a terra|Scendi controllato fino a sfiorare il petto all'altezza dello sterno|Gomiti a circa 45° dal busto, non aperti a 90°|Spingi su e leggermente indietro, verso la linea degli occhi", "Rimbalzare il bilanciere sul petto o staccare i glutei dalla panca."],
  ["panca-piana-man", "Panca piana con manubri", "Petto", "Manubri", "Porta i manubri all'altezza del petto con i gomiti a 45°|Spingi in alto facendoli avvicinare leggermente sopra il petto|Scendi lento finché senti allungare i pettorali|Tieni le scapole addotte per tutta la serie", "Far scontrare i manubri in alto e perdere tensione sul petto."],
  ["panca-incl-bil", "Panca inclinata con bilanciere", "Petto", "Bilanciere", "Schienale a 30°, non di più|Il bilanciere scende sulla parte alta del petto, sotto le clavicole|Scapole indietro e petto in fuori|Spingi in verticale senza bloccare di colpo i gomiti", "Inclinazione troppo alta: il lavoro passa dal petto alle spalle."],
  ["panca-incl-man", "Panca inclinata con manubri", "Petto", "Manubri", "Schienale a 30°, manubri ai lati della parte alta del petto|Gomiti leggermente sotto la linea delle spalle|Spingi in alto convergendo un po'|Scendi in 2-3 secondi per sentire l'allungamento", "Inarcare troppo la schiena trasformandola in una panca piana."],
  ["panca-incl-multi", "Panca inclinata al multipower", "Petto", "Multipower", "Posiziona la panca a 30° in modo che la sbarra scenda sulla parte alta del petto|Sblocca ruotando i polsi e tieni le scapole strette|Scendi controllato fino a sfiorare il petto|Spingi senza staccare spalle e glutei dalla panca", "Panca nella posizione sbagliata: la sbarra scende sul collo o sullo sterno."],
  ["panca-decl", "Panca declinata", "Petto", "Bilanciere", "Blocca bene le gambe nei rulli|Il bilanciere scende sulla parte bassa del petto|Gomiti a 45° dal busto|Spingi in linea retta", "Scendere troppo veloce senza controllo, rischioso a testa in giù."],
  ["chest-press", "Chest press", "Petto", "Macchina", "Regola il sedile: impugnature a metà petto|Schiena e testa appoggiate, spalle basse|Spingi in avanti senza bloccare i gomiti|Ritorna lento fino a sentire allungare il petto", "Spalle che salgono verso le orecchie durante la spinta."],
  ["chest-press-incl", "Chest press inclinata", "Petto", "Macchina", "Impugnature all'altezza della parte alta del petto|Scapole indietro e schiena appoggiata|Spingi in alto e in avanti|Controlla bene il ritorno", "Staccare la schiena dallo schienale per spingere più peso."],
  ["pectoral-machine", "Pectoral machine (pec fly)", "Petto", "Macchina", "Regola il sedile: braccia all'altezza delle spalle|Gomiti leggermente flessi e fermi in quella posizione|Chiudi davanti stringendo il petto per 1 secondo|Riapri lento fino a sentire allungare, senza andare troppo dietro", "Usare lo slancio o piegare e stendere i gomiti come in una spinta."],
  ["croci-man", "Croci con manubri", "Petto", "Manubri", "Sdraiato in panca, manubri sopra il petto con palmi uno verso l'altro|Apri ad arco con i gomiti leggermente piegati|Scendi finché senti un buon allungamento|Richiudi come per abbracciare un albero", "Scendere troppo con pesi pesanti, sovraccaricando la spalla."],
  ["croci-cavi", "Croci ai cavi alti", "Petto", "Cavi", "Carrucole in alto, un passo avanti con busto leggermente inclinato|Gomiti morbidi e fermi|Porta le mani verso il basso e al centro, davanti al bacino|Torna lento sentendo l'allungamento", "Tirare con le braccia invece di chiudere con il petto."],
  ["croci-cavi-basso", "Croci ai cavi dal basso", "Petto", "Cavi", "Carrucole in basso, busto dritto|Porta le mani in alto e al centro all'altezza del viso|Gomiti leggermente flessi|Lavora la parte alta del petto, scendi controllato", "Alzare le spalle insieme alle mani."],
  ["dip-petto", "Dip alle parallele", "Petto", "Corpo libero", "Busto inclinato in avanti per coinvolgere il petto|Scendi finché le spalle sono all'altezza dei gomiti|Gomiti leggermente aperti|Spingi su senza bloccare di scatto", "Scendere troppo in basso con le spalle che vanno in avanti."],
  ["piegamenti", "Piegamenti sulle braccia", "Petto", "Corpo libero", "Mani poco più larghe delle spalle|Corpo dritto dalla testa ai talloni, addome contratto|Scendi fino a sfiorare il pavimento col petto|Gomiti a 45°, non aperti a T", "Bacino che cade verso il basso o sedere alzato."],
  ["pullover-man", "Pullover con manubrio", "Petto", "Manubri", "Sdraiato in panca, manubrio tenuto con due mani sopra il petto|Gomiti leggermente flessi e fermi|Porta il manubrio dietro la testa finché senti allungare|Riporta sopra il petto senza piegare le braccia", "Piegare e stendere i gomiti trasformandolo in un esercizio per tricipiti."],

  ["lat-larga", "Lat machine presa larga", "Dorso", "Macchina", "Presa prona più larga delle spalle, cosce bloccate|Busto leggermente inclinato indietro|Tira la barra verso la parte alta del petto portando i gomiti in basso|Risali lento fino ad allungare bene le braccia", "Tirare dietro la nuca o oscillare il busto per aiutarsi."],
  ["lat-prona", "Lat machine presa prona", "Dorso", "Macchina", "Presa prona poco più larga delle spalle|Petto in fuori e scapole che scendono prima di tirare|Porta la barra al petto pensando a spingere i gomiti verso i fianchi|Risali controllato", "Tirare con i bicipiti senza sentire il dorso."],
  ["lat-inversa", "Lat machine presa inversa", "Dorso", "Macchina", "Presa supina larghezza spalle|Busto leggermente indietro, petto alto|Tira la barra verso il petto con i gomiti vicini al corpo|Risali lento allungando i dorsali", "Usare troppo i bicipiti e accorciare il movimento."],
  ["lat-triangolo", "Lat machine con triangolo", "Dorso", "Macchina", "Impugna il triangolo, petto in fuori|Tira verso la parte alta del petto|Gomiti stretti e diretti verso il basso|Risali allungando completamente", "Inclinarsi troppo indietro trasformandola in un rematore."],
  ["trazioni", "Trazioni alla sbarra", "Dorso", "Corpo libero", "Presa prona poco più larga delle spalle|Parti a braccia tese, scapole che scendono|Tira finché il mento supera la sbarra|Scendi controllato fino a braccia distese", "Fare mezze ripetizioni o dondolare con le gambe."],
  ["trazioni-assistite", "Trazioni assistite", "Dorso", "Macchina", "Ginocchia sulla pedana, presa larga sopra le spalle|Più peso imposti, più la macchina ti aiuta|Tira portando il petto verso la sbarra|Scendi lento a braccia tese", "Scegliere troppa assistenza e non fare fatica."],
  ["pulley", "Pulley con triangolo", "Dorso", "Cavi", "Piedi sulla pedana, ginocchia leggermente flesse|Schiena dritta, busto quasi verticale|Tira il triangolo verso l'ombelico stringendo le scapole|Ritorna allungando le braccia senza curvare la schiena", "Dondolare avanti e indietro con il busto per tirare."],
  ["pulley-larga", "Pulley presa larga", "Dorso", "Cavi", "Barra dritta con presa larga|Busto fermo e schiena neutra|Tira verso la parte bassa del petto con i gomiti aperti|Stringi le scapole e torna lento", "Alzare le spalle verso le orecchie."],
  ["rematore-bil", "Rematore con bilanciere", "Dorso", "Bilanciere", "Busto inclinato a 45° circa, schiena dritta|Ginocchia morbide, bilanciere sotto le spalle|Tira verso l'ombelico portando i gomiti indietro|Scendi controllato senza curvare la schiena", "Schiena curva o busto che si raddrizza a ogni ripetizione."],
  ["rematore-man", "Rematore con manubrio", "Dorso", "Manubri", "Ginocchio e mano sulla panca, schiena piatta|Il manubrio pende sotto la spalla|Tira verso il fianco, non verso il petto|Scendi lento allungando il dorsale", "Ruotare il busto per tirare più peso."],
  ["t-bar", "T-bar row", "Dorso", "Bilanciere", "Gambe divaricate sopra la barra, ginocchia flesse|Schiena dritta e busto inclinato|Tira l'impugnatura verso il petto|Scendi controllato", "Usare lo slancio delle gambe."],
  ["low-row", "Seated row (rematore seduto alla macchina)", "Dorso", "Macchina", "Regola il sedile: impugnature all'altezza del petto basso|Petto contro il supporto, schiena dritta|Tira con entrambe le braccia portando i gomiti indietro e stringendo le scapole|Torna lento allungando le braccia", "Staccare il petto dal supporto o tirare con le spalle alzate."],
  ["pulldown-tese", "Pulldown a braccia tese", "Dorso", "Cavi", "Davanti al cavo alto, busto leggermente inclinato|Braccia quasi tese, gomiti fermi|Porta la barra verso le cosce con i dorsali|Risali lento fino all'altezza della testa", "Piegare i gomiti trasformandolo in un pushdown."],
  ["hyperextension", "Hyperextension", "Dorso", "Panca", "Bacino appoggiato al cuscinetto, piedi bloccati|Braccia incrociate al petto|Scendi a schiena dritta piegando le anche|Risali fino ad allineare il busto alle gambe, non oltre", "Inarcare troppo la schiena in alto."],
  ["stacco-bil", "Stacco da terra", "Dorso", "Bilanciere", "Piedi larghezza anche, bilanciere sopra metà piede|Schiena dritta, petto alto, braccia tese|Spingi con le gambe tenendo il bilanciere vicino al corpo|In alto stendi le anche senza inarcarti", "Schiena curva durante la salita."],
  ["stacco-rumeno-man", "Stacco rumeno con manubri", "Femorali e glutei", "Manubri", "In piedi, manubri davanti alle cosce, ginocchia leggermente flesse|Porta indietro il bacino tenendo la schiena dritta|Scendi lungo le gambe fino a sentire tirare i femorali|Risali spingendo il bacino in avanti", "Piegare troppo le ginocchia o curvare la schiena."],
  ["stacco-rumeno-bil", "Stacco rumeno con bilanciere", "Femorali e glutei", "Bilanciere", "Bilanciere a contatto con le cosce|Bacino indietro, ginocchia quasi ferme|Scendi fino a metà tibia o finché la schiena resta dritta|Risali stringendo i glutei", "Allontanare il bilanciere dalle gambe."],
  ["scrollate", "Scrollate", "Dorso", "Manubri", "In piedi con manubri ai lati|Alza le spalle verso le orecchie in verticale|Tieni 1 secondo in alto|Scendi lento", "Ruotare le spalle in cerchio."],

  ["lento-man", "Lento con manubri", "Spalle", "Manubri", "Seduto, schienale quasi verticale|Manubri all'altezza delle orecchie, gomiti sotto i polsi|Spingi in alto senza far toccare i manubri|Scendi controllato fino all'altezza delle orecchie", "Inarcare la schiena per spingere più peso."],
  ["lento-bil", "Lento avanti con bilanciere", "Spalle", "Bilanciere", "In piedi o seduto, bilanciere sulla parte alta del petto|Glutei e addome contratti|Spingi sopra la testa portando la testa leggermente avanti alla fine|Scendi controllato", "Spingere con le gambe o inarcare la schiena."],
  ["shoulder-press", "Shoulder press", "Spalle", "Macchina", "Regola il sedile: impugnature all'altezza delle spalle|Schiena appoggiata|Spingi in alto senza bloccare i gomiti|Scendi lento", "Sedile troppo basso che stressa le spalle."],
  ["arnold", "Arnold press", "Spalle", "Manubri", "Parti con i manubri davanti al viso, palmi verso di te|Spingendo in alto ruota i palmi in avanti|Arriva sopra la testa|Ritorna ruotando al contrario", "Andare troppo veloci perdendo il controllo della rotazione."],
  ["alzate-lat-man", "Alzate laterali con manubri", "Spalle", "Manubri", "In piedi, gomiti leggermente flessi|Alza le braccia lateralmente fino all'altezza delle spalle|Guida il movimento con i gomiti, non con le mani|Scendi lento in 2-3 secondi", "Usare lo slancio del busto o alzare le spalle."],
  ["alzate-lat-cavo", "Alzate laterali al cavo", "Spalle", "Cavi", "Cavo basso, impugnatura nella mano opposta alla carrucola|Busto fermo, leggermente lontano dalla macchina|Alza il braccio lateralmente fino all'altezza della spalla|Scendi lento mantenendo la tensione", "Lasciar tornare il cavo di colpo."],
  ["alzate-lat-macchina", "Alzate laterali alla macchina", "Spalle", "Macchina", "Spalle allineate al perno della macchina|Gomiti contro i cuscinetti|Alza fino all'altezza delle spalle|Scendi lento", "Alzare le spalle verso le orecchie."],
  ["alzate-front", "Alzate frontali", "Spalle", "Manubri", "In piedi, manubri davanti alle cosce|Alza un braccio o entrambi davanti fino all'altezza degli occhi|Gomiti leggermente flessi|Scendi controllato", "Dondolare con il busto."],
  ["alzate-post", "Alzate posteriori a busto flesso", "Spalle", "Manubri", "Busto inclinato quasi parallelo al pavimento, schiena dritta|Manubri sotto il petto, gomiti morbidi|Apri le braccia lateralmente fino all'altezza delle spalle|Scendi lento", "Stringere le scapole: il lavoro va al deltoide posteriore, non al dorso."],
  ["reverse-fly", "Pick back (reverse fly alla macchina)", "Spalle", "Macchina", "Seduto con il petto contro lo schienale|Impugnature all'altezza delle spalle, braccia quasi tese|Apri le braccia all'indietro fino in linea con il corpo|Torna lento", "Usare slancio e piegare i gomiti."],
  ["face-pull", "Face pull", "Spalle", "Cavi", "Corda al cavo all'altezza del viso|Tira verso il viso aprendo la corda ai lati|Gomiti alti, all'altezza delle spalle|Torna lento", "Tirare verso il petto con i gomiti bassi."],
  ["tirate-mento", "Tirate al mento", "Spalle", "Bilanciere", "Presa larghezza spalle o più larga|Tira il bilanciere lungo il corpo fino al petto|I gomiti guidano e restano sopra i polsi|Scendi controllato", "Presa troppo stretta e tirare troppo in alto, stressando le spalle."],

  ["curl-bil", "Curl con bilanciere", "Bicipiti", "Bilanciere", "In piedi, presa supina larghezza spalle|Gomiti fermi ai fianchi|Porta il bilanciere verso le spalle|Scendi lento fino a braccia quasi tese", "Dondolare con la schiena per tirare su il peso."],
  ["curl-ez", "Curl con bilanciere EZ", "Bicipiti", "Bilanciere", "Impugna le curve interne della barra EZ|Gomiti ai fianchi|Sali contraendo il bicipite|Scendi controllato", "Portare i gomiti in avanti alla fine del movimento."],
  ["curl-man", "Curl con manubri", "Bicipiti", "Manubri", "In piedi o seduto, palmi in avanti|Gomiti fermi accanto al busto|Sali fino a contrarre il bicipite|Scendi in 2-3 secondi", "Usare lo slancio e accorciare la discesa."],
  ["curl-alternato", "Curl alternato", "Bicipiti", "Manubri", "Parti con i palmi verso le cosce|Salendo ruota il palmo verso l'alto|Un braccio alla volta, busto fermo|Scendi lento prima di cambiare braccio", "Ruotare il busto per aiutarsi."],
  ["hammer", "Hammer curl", "Bicipiti", "Manubri", "Palmi uno verso l'altro, come impugnando un martello|Gomiti fermi ai fianchi|Sali fino all'altezza delle spalle|Scendi lento", "Portare i gomiti in avanti."],
  ["panca-scott", "Curl alla panca Scott", "Bicipiti", "Bilanciere", "Ascelle appoggiate al bordo della panca|Braccia ben appoggiate sul cuscino|Sali contraendo il bicipite|Scendi quasi fino a braccia tese, senza bloccare di colpo", "Staccare i gomiti dal cuscino o lasciarsi cadere in basso."],
  ["curl-concentrato", "Curl concentrato", "Bicipiti", "Manubri", "Seduto, gomito appoggiato all'interno della coscia|Sali lento portando il manubrio alla spalla|Stringi 1 secondo in alto|Scendi controllato", "Muovere la spalla per aiutarsi."],
  ["curl-cavo", "Curl ai cavi", "Bicipiti", "Cavi", "Cavo basso con barra o corda|Gomiti ai fianchi e fermi|Porta l'impugnatura verso le spalle|Scendi lento mantenendo la tensione", "Inclinarsi indietro per tirare."],
  ["curl-incl", "Curl su panca inclinata", "Bicipiti", "Manubri", "Schienale a 45-60°, braccia che pendono|Gomiti fermi dietro la linea del busto|Sali senza portare i gomiti avanti|Scendi fino a braccia tese", "Peso troppo alto che obbliga a muovere le spalle."],
  ["curl-macchina", "Curl alla macchina", "Bicipiti", "Macchina", "Regola il sedile: gomiti allineati al perno|Braccia appoggiate al cuscino|Sali contraendo|Scendi lento", "Sedile regolato male che sposta il gomito dal perno."],

  ["pushdown", "Push down al cavo", "Tricipiti", "Cavi", "Davanti al cavo alto, barra impugnata|Gomiti attaccati ai fianchi e fermi|Spingi in basso fino a braccia tese|Risali fino a 90° senza muovere i gomiti", "Gomiti che si alzano e si allontanano dal corpo."],
  ["pushdown-corda", "Push down con corda", "Tricipiti", "Cavi", "Corda al cavo alto, gomiti ai fianchi|Spingi in basso aprendo la corda alla fine|Stringi i tricipiti 1 secondo|Risali controllato", "Piegarsi in avanti e spingere con il peso del corpo."],
  ["french-press", "French press", "Tricipiti", "Bilanciere", "Sdraiato in panca, bilanciere EZ sopra il petto|Gomiti fermi, puntati verso il soffitto|Scendi verso la fronte piegando solo i gomiti|Stendi le braccia senza muovere le spalle", "Gomiti che si aprono verso l'esterno."],
  ["french-man", "French press con manubri", "Tricipiti", "Manubri", "Sdraiato, manubri sopra il petto con palmi uno verso l'altro|Gomiti fermi|Scendi ai lati della testa|Stendi le braccia", "Muovere le braccia dalla spalla."],
  ["estensioni-sopra-testa", "Estensioni sopra la testa con manubrio", "Tricipiti", "Manubri", "Seduto, manubrio tenuto con due mani sopra la testa|Gomiti vicini alla testa e puntati in alto|Scendi dietro la testa|Stendi le braccia", "Gomiti che si allargano."],
  ["estensioni-cavo", "Estensioni sopra la testa al cavo basso", "Tricipiti", "Cavi", "Di spalle al cavo basso, corda impugnata dietro la testa con i gomiti piegati|Gomiti fermi, vicini alla testa e puntati verso l'alto|Stendi le braccia verso l'alto contraendo i tricipiti|Torna lento dietro la testa sentendo allungare i tricipiti", "Gomiti che si aprono o si muovono avanti e indietro durante la spinta."],
  ["kickback", "Kickback", "Tricipiti", "Manubri", "Busto inclinato, braccio parallelo al busto|Gomito fermo vicino al fianco|Stendi l'avambraccio indietro|Torna lento a 90°", "Dondolare il braccio."],
  ["dip-panca", "Dip tra due panche", "Tricipiti", "Corpo libero", "Mani sulla panca dietro di te|Scendi piegando i gomiti all'indietro|Fermati a 90° di flessione|Spingi su", "Scendere troppo, stressando le spalle."],
  ["dip-macchina", "Dip alla macchina", "Tricipiti", "Macchina", "Seduto, impugnature ai lati|Busto dritto|Spingi in basso fino a braccia tese|Risali controllato", "Alzare le spalle."],
  ["panca-stretta", "Panca presa stretta", "Tricipiti", "Bilanciere", "Presa larghezza spalle|Gomiti vicini al corpo|Scendi verso la parte bassa del petto|Spingi su con i tricipiti", "Presa troppo stretta che stressa i polsi."],

  ["squat-bil", "Squat con bilanciere", "Quadricipiti", "Bilanciere", "Bilanciere sui trapezi, piedi larghezza spalle|Petto alto e addome contratto|Scendi portando il bacino indietro e in basso, ginocchia in linea con le punte|Risali spingendo con tutto il piede", "Ginocchia che cadono verso l'interno."],
  ["front-squat", "Front squat", "Quadricipiti", "Bilanciere", "Bilanciere sulle spalle davanti, gomiti alti|Busto verticale|Scendi controllato|Risali spingendo con i talloni", "Gomiti che si abbassano facendo scivolare il bilanciere."],
  ["goblet", "Goblet squat", "Quadricipiti", "Manubri", "Manubrio tenuto al petto con due mani|Piedi poco più larghi delle spalle|Scendi tra le ginocchia tenendo il busto dritto|Risali", "Talloni che si staccano da terra."],
  ["leg-press", "Leg press", "Quadricipiti", "Macchina", "Piedi a metà pedana, larghezza spalle|Schiena e bacino ben appoggiati|Scendi finché le ginocchia sono a circa 90°|Spingi senza bloccare le ginocchia in alto", "Scendere troppo staccando il bacino dallo schienale."],
  ["hack-squat", "Hack squat", "Quadricipiti", "Macchina", "Schiena contro lo schienale, spalle sotto i cuscinetti|Piedi a metà pedana|Scendi controllato|Spingi senza bloccare le ginocchia", "Talloni che si sollevano."],
  ["v-squat", "V-Squat", "Quadricipiti", "Macchina", "Spalle sotto i cuscinetti, schiena appoggiata|Piedi larghezza spalle a metà pedana|Scendi finché le cosce sono parallele|Risali spingendo con tutto il piede", "Ginocchia che cadono verso l'interno."],
  ["affondi", "Affondi", "Quadricipiti", "Manubri", "Fai un passo avanti lungo|Scendi finché il ginocchio dietro quasi tocca terra|Busto dritto, ginocchio davanti sopra la caviglia|Spingi con il piede davanti per tornare", "Passo troppo corto con il ginocchio che va molto oltre la punta."],
  ["affondi-camminata", "Affondi in camminata", "Quadricipiti", "Manubri", "Fai affondi alternati avanzando|Busto dritto|Ginocchio dietro quasi a terra|Spingi e porta avanti l'altra gamba", "Perdere l'equilibrio andando troppo veloci."],
  ["bulgaro", "Squat bulgaro", "Quadricipiti", "Manubri", "Piede dietro appoggiato alla panca|Piede davanti abbastanza lontano|Scendi verticale fino a 90°|Risali spingendo con il tallone davanti", "Piede davanti troppo vicino alla panca."],
  ["leg-extension", "Leg extension", "Quadricipiti", "Macchina", "Ginocchio allineato al perno della macchina|Rullo appena sopra le caviglie|Stendi le gambe e stringi 1 secondo|Scendi lento senza far sbattere i pesi", "Andare di slancio sollevando il bacino dal sedile."],
  ["step-up", "Step up", "Quadricipiti", "Manubri", "Piede intero sulla panca|Spingi con la gamba sopra senza aiutarti con quella sotto|Arriva in piedi sulla panca|Scendi controllato", "Darsi la spinta con la gamba a terra."],

  ["leg-curl", "Leg curl sdraiato", "Femorali e glutei", "Macchina", "Ginocchia appena oltre il bordo della panca|Rullo sopra i talloni|Porta i talloni verso i glutei|Scendi lento senza staccare il bacino", "Alzare il bacino per aiutarsi."],
  ["leg-curl-seduto", "Leg curl seduto", "Femorali e glutei", "Macchina", "Ginocchio allineato al perno|Blocca le cosce con il cuscino|Piega le gambe verso il basso|Ritorna lento", "Rullo posizionato troppo in alto sul polpaccio."],
  ["hip-thrust", "Hip thrust", "Femorali e glutei", "Bilanciere", "Schiena appoggiata alla panca all'altezza delle scapole|Bilanciere sulle anche con imbottitura|Spingi il bacino in alto stringendo i glutei|In alto il busto è parallelo al pavimento, poi scendi", "Inarcare la schiena invece di stendere le anche."],
  ["glute-bridge", "Ponte per glutei", "Femorali e glutei", "Corpo libero", "Sdraiato, piedi a terra vicino ai glutei|Spingi il bacino in alto con i talloni|Stringi i glutei 1 secondo|Scendi lento", "Spingere con la punta dei piedi."],
  ["abductor", "Abductor (macchina abduttori)", "Femorali e glutei", "Macchina", "Schiena appoggiata, cuscinetti all'esterno delle ginocchia|Apri le gambe in modo controllato|Tieni 1 secondo aperto|Richiudi lento", "Fare rimbalzare i pesi."],
  ["adductor", "Adductor (macchina adduttori)", "Femorali e glutei", "Macchina", "Cuscinetti all'interno delle ginocchia|Chiudi le gambe controllando|Stringi 1 secondo|Riapri lento fino a sentire allungare", "Aprire troppo all'inizio con peso alto."],
  ["good-morning", "Good morning", "Femorali e glutei", "Bilanciere", "Bilanciere sui trapezi, ginocchia morbide|Porta il bacino indietro con la schiena dritta|Scendi finché senti tirare i femorali|Risali stendendo le anche", "Curvare la schiena."],
  ["kickback-glutei", "Slanci per glutei al cavo", "Femorali e glutei", "Cavi", "Cavigliera al cavo basso|Mani sulla macchina, busto leggermente inclinato|Porta la gamba indietro stringendo il gluteo|Torna lento", "Inarcare la schiena per alzare di più la gamba."],

  ["calf-piedi", "Calf raise in piedi", "Polpacci", "Macchina", "Avampiede sul bordo, talloni liberi|Ginocchia quasi tese|Sali sulle punte il più possibile e tieni 1 secondo|Scendi lento fino ad allungare bene", "Movimento corto e veloce che rimbalza."],
  ["calf-seduto", "Calf raise seduto", "Polpacci", "Macchina", "Seduto, cuscinetti sulle cosce vicino alle ginocchia|Avampiede sul bordo|Sali sulle punte|Scendi lento", "Rimbalzare in basso."],
  ["calf-pressa", "Calf alla leg press", "Polpacci", "Macchina", "Solo l'avampiede sul bordo basso della pedana|Ginocchia quasi tese|Spingi con le punte|Torna lento allungando", "Piegare le ginocchia."],

  ["crunch", "Crunch", "Addome", "Corpo libero", "Sdraiato, ginocchia piegate e piedi a terra|Mani dietro la testa senza tirare il collo|Solleva le spalle arrotolando la schiena|Scendi lento senza appoggiare del tutto la testa", "Tirare la testa con le mani."],
  ["crunch-alti", "Crunch con gambe sollevate", "Addome", "Corpo libero", "Sdraiato sul tappetino, gambe sollevate con ginocchia a 90°|Solleva le spalle verso le ginocchia|Espira salendo|Scendi lento", "Usare lo slancio delle braccia."],
  ["crunch-cavi", "Crunch ai cavi", "Addome", "Cavi", "In ginocchio davanti al cavo alto, corda ai lati della testa|Fianchi fermi|Arrotola il busto portando i gomiti verso le cosce|Risali lento", "Sedersi sui talloni invece di flettere l'addome."],
  ["crunch-inverso", "Crunch inverso", "Addome", "Corpo libero", "Sdraiato, gambe piegate in alto|Porta le ginocchia verso il petto sollevando il bacino|Scendi controllato|Mani a terra solo come appoggio", "Dondolare con le gambe."],
  ["crunch-macchina", "Crunch alla macchina", "Addome", "Macchina", "Regola il sedile e impugna le maniglie|Arrotola il busto in avanti|Stringi l'addome 1 secondo|Ritorna lento", "Spingere con le braccia."],
  ["plank", "Plank", "Addome", "Corpo libero", "Avambracci a terra sotto le spalle|Corpo dritto dalla testa ai talloni|Addome e glutei contratti|Respira normalmente", "Bacino che scende o sedere alzato."],
  ["plank-laterale", "Plank laterale", "Addome", "Corpo libero", "Su un avambraccio, gomito sotto la spalla|Corpo in linea retta|Bacino alto|Tieni la posizione", "Lasciar cadere il bacino."],

  if (e.target === sheetEl || e.target.closest("[data-close]")) return closeSheet();

  const g = e.target.closest("[data-g]");
  if (g) { SH.g = g.dataset.g; sheetBox.querySelectorAll("[data-g]").forEach(b => b.setAttribute("aria-pressed", b.dataset.g === SH.g)); return renderList(); }
  const it = e.target.closest("[data-lib]");
  if (it && SH.mode === "add") { addExercise(SH.day, SH.sec, it.dataset.lib); closeSheet(); return softRender(); }
  if (e.target.closest("[data-free]")) { addExercise(SH.day, SH.sec, null, SH.q.trim()); closeSheet(); return softRender(); }
  if (it) return pickLib(it.dataset.lib);
});
sheetEl.addEventListener("input", e => { if (e.target.id === "libq") { SH.q = e.target.value; renderList(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheetEl.hidden) closeSheet(); });

// ---------- Rest timer ----------
const T = { end: 0, total: 0, label: "", iv: null, goUntil: 0 };
const tEl = document.getElementById("timer"), clockEl = document.getElementById("clock"), barEl = document.getElementById("tBar"), lblEl = document.getElementById("tLabel");
function startTimer(sec, label) {
  T.total = sec; T.end = Date.now() + sec * 1000; T.label = label; T.goUntil = 0;
  tEl.classList.add("on"); tEl.classList.remove("go");
  clearInterval(T.iv); T.iv = setInterval(tick, 250); tick();
  restToSw();
}
function stopTimer() { clearInterval(T.iv); T.iv = null; tEl.classList.remove("on", "go"); swPost({ type: "rest-cancel" }); }
// The service worker shows the countdown and the "rest over" notification while the app is in the background.
function swPost(msg) { try { const c = navigator.serviceWorker && navigator.serviceWorker.controller; if (c) c.postMessage(msg); } catch (e) {} }
function restToSw() { if (notifOn()) swPost({ type: "rest-start", end: T.end, label: T.label.replace(/ \(dopo il riscaldamento\)$/, "") }); }
const notifOn = () => STANDALONE && "Notification" in window && Notification.permission === "granted";
function tick() {
  const now = Date.now();
  if (T.goUntil) { if (now > T.goUntil) stopTimer(); return; }
  const left = Math.max(0, Math.ceil((T.end - now) / 1000));
  clockEl.textContent = fmtRest(left) || "0:00";
  lblEl.textContent = "Recupero · " + T.label;
  barEl.style.width = (T.total ? Math.max(0, (T.end - now) / (T.total * 1000)) * 100 : 0) + "%";
  if (left <= 0) {
    clockEl.textContent = "Vai!"; lblEl.textContent = "Recupero finito · " + T.label;
    tEl.classList.add("go"); T.goUntil = now + 4000;
    beep(); try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch (e) {}
  }
}
document.getElementById("tPlus").onclick = () => { if (T.goUntil) return; T.end += 15000; T.total += 15; tick(); restToSw(); };
document.getElementById("tMinus").onclick = () => { if (T.goUntil) return; T.end -= 15000; tick(); restToSw(); };
document.getElementById("tSkip").onclick = stopTimer;
let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }
function beep() {
  if (!actx) return;
  try {
    [0, 0.25, 0.5].forEach((t, k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = k === 2 ? 1320 : 880; o.connect(g); g.connect(actx.destination);
      const st = actx.currentTime + t; g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.4, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.18);
      o.start(st); o.stop(st + 0.2);
    });
  } catch (e) {}
}
let lock = null;
async function keepAwake() { try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } } catch (e) {} }
document.addEventListener("visibilitychange", () => { swPost({ type: "visibility" }); if (document.visibilityState === "visible") { if (T.iv) tick(); if (DAYS.some(d => S.drafts[d] && hasDone(S.drafts[d]))) keepAwake(); } });

// ---------- Boot ----------
let savedTab = null; try { savedTab = sessionStorage.getItem("sp.tab"); } catch (e) {}
S.view = savedTab && (DAYS.includes(savedTab) || savedTab === "hist") ? savedTab : defaultDay();
setSync();
render();
store.init();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
